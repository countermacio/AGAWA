<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria – Pensjonat AGAWA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fbf9f5;
            color: #2d3437;
        }

        header {
            background-color: #F3EEDB;
            padding: 10px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(70, 50, 30, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        header img {
            max-height: 440px;
            width: auto;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        nav {
            font-size: 20px;
            text-align: center;
            padding: 16px;
            background-color: #ede5d5;
            border-bottom: 1px solid #dfd6c3;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        nav a {
            text-decoration: none;
            color: #154e7d;
            margin: 0 12px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #b88432;
        }

        .content {
            padding: 30px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .content h2 {
            color: #154e7d;
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e7dfce;
            padding-bottom: 8px;
        }

        .content p {
            color: #4b555a;
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #ffffff;
            border: 1px solid #eadecc;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            font-size: 20px;
            color: #154e7d;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(80, 65, 45, 0.06);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .gallery-item:hover {
            background-color: #f5efe3;
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(80, 65, 45, 0.12);
        }
    </style>
</head>
<body>

    <header>
        <img src="Logo Agawa.png" alt="Logo Pensjonat AGAWA">
    </header>

    <nav>
        <a href="index.html">Strona główna</a> |
        <a href="oferta.html">Oferta</a> |
        <a href="cennik.html">Cennik i rezerwacje</a> |
        <a href="galeria.html">Galeria</a> |
        <a href="onas.html">O nas</a> |
        <a href="kontakt.html">Kontakt</a>
    </nav>

    <div class="content">

        <h2>Nasza galeria</h2>
        <p>Wkrótce dodamy zdjęcia przedstawiające pokoje, ogród oraz okolicę pensjonatu.</p>

        <div class="gallery-grid">
            <div class="gallery-item">Zdjęcie pokoju</div>
            <div class="gallery-item">Zdjęcie ogrodu</div>
            <div class="gallery-item">Zdjęcie okolicy</div>
            <div class="gallery-item">Zdjęcie pensjonatu</div>
            <div class="gallery-item">Zdjęcie tarasu</div>
            <div class="gallery-item">Zdjęcie plaży</div>
        </div>

    </div>

</body>
</html>
