<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt – Pensjonat AGAWA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fbf9f5;
            color: #2d3437;
        }

        header {
            background-color: #F3EEDB;
            padding: 10px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(70, 50, 30, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        header img {
            max-height: 440px;
            width: auto;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        nav {
            font-size: 20px;
            text-align: center;
            padding: 16px;
            background-color: #ede5d5;
            border-bottom: 1px solid #dfd6c3;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        nav a {
            text-decoration: none;
            color: #154e7d;
            margin: 0 12px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #b88432;
        }

        .content {
            padding: 30px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .contact-box {
            background: #ffffff;
            border: 1px solid #eadecc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(80, 65, 45, 0.06);
            font-size: 18px;
            line-height: 1.6;
        }

        .contact-box h2 {
            color: #154e7d;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e7dfce;
            padding-bottom: 8px;
        }

        .contact-item {
            background-color: #f5efe3;
            border: 1px solid #e5dcc9;
            padding: 16px 20px;
            border-radius: 8px;
            margin-top: 12px;
            box-shadow: 0 2px 6px rgba(80, 65, 45, 0.04);
            font-size: 18px;
            color: #2d3437;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-icon {
            width: 22px;
            height: 22px;
            stroke: #154e7d;
            flex-shrink: 0;
        }

        .contact-item strong,
        .contact-item a {
            color: #154e7d;
            text-decoration: none;
        }

        .contact-item a:hover {
            color: #b88432;
        }

        /* KONTENER MAPY GOOGLE */
        .map-section {
            background: #ffffff;
            border: 1px solid #eadecc;
            border-radius: 10px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 4px 12px rgba(80, 65, 45, 0.06);
            text-align: center;
        }

        .map-section h3 {
            color: #154e7d;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .map-frame {
            width: 100%;
            height: 380px;
            border: 1px solid #dfd6c3;
            border-radius: 8px;
            display: block;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
            padding: 12px 24px;
            background-color: #154e7d;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .map-btn:hover {
            background-color: #b88432;
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            stroke: #ffffff;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <img src="Logo Agawa.png" alt="Logo Pensjonat AGAWA">
    </header>

    <nav>
        <a href="index.html">Strona główna</a> |
        <a href="oferta.html">Oferta</a> |
        <a href="cennik.html">Cennik i rezerwacje</a> |
        <a href="galeria.html">Galeria</a> |
        <a href="onas.html">O nas</a> |
        <a href="kontakt.html">Kontakt</a>
    </nav>

                </svg>
                <span>Telefon: <strong><a href="tel:665097710">665 097 710</a></strong></span>

                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>

                    <polyline points="12 6 12 12 16 14"></polyline>

                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>Adres: <strong>ul. Kolejowa 6, 78‑111 Ustronie Morskie</strong></span>
            </div>

        </div>

        <!-- SEKCJA Z MAPĄ GOOGLE I PRZYCISKIEM NAWIGACJI -->
        <div class="map-section">
            <h3>Lokalizacja na mapie</h3>
            <iframe 
                class="map-frame"
                src="https://maps.google.com/maps?q=ul.+Kolejowa+6,+78-111+Ustronie+Morskie&t=&z=15&ie=UTF8&iwloc=&output=embed"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
            </iframe>
            
            <a href="https://maps.google.com/?q=ul.+Kolejowa+6,+78-111+Ustronie+Morskie" target="_blank" rel="noopener noreferrer" class="map-btn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                </svg>
                Otwórz nawigację w Google Maps
            </a>
        </div>

    </div>

</body>
</html>
